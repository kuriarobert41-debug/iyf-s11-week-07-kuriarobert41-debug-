<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Week 7 - JS Best Practices (To-Do & Shopping Cart)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Week 7 Exercises — To‑Do & Shopping Cart</h1>

    <section id="todo-section">
      <h2>To‑Do List</h2>
      <form id="todo-form">
        <input id="todo-input" name="todo" placeholder="Add a todo" autocomplete="off" />
        <button type="submit">Add</button>
      </form>

      <div class="filters">
        <label>
          <input type="radio" name="filter" value="all" checked /> All
        </label>
        <label>
          <input type="radio" name="filter" value="active" /> Active
        </label>
        <label>
          <input type="radio" name="filter" value="completed" /> Completed
        </label>
      </div>

      <ul id="todo-list"></ul>
    </section>

    <hr />

    <section id="cart-section">
      <h2>Shopping Cart (mini project)</h2>
      <div id="products"></div>
      <h3>Cart</h3>
      <div id="cart-count">Items: 0</div>
      <ul id="cart-list"></ul>
      <div id="cart-total">Total: $0.00</div>
      <button id="clear-cart">Clear Cart</button>
    </section>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
